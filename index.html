<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水果注音大冒險 - 兒童繁體中文注音學習</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Mochiyom+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Zen Maru Gothic', 'Mochiyom Pop One', sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            touch-action: manipulation;
            user-select: none;
        }

        .font-fun {
            font-family: 'Fredoka One', 'Mochiyom Pop One', cursive;
        }

        /* 注音標註專用樣式 */
        ruby {
            ruby-position: over;
        }
        rt {
            font-size: 0.55em;
            color: #d97706;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* 可愛卡片與按鈕特效 */
        .btn-cute {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 0 rgba(0,0,0,0.15);
        }
        .btn-cute:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 0 rgba(0,0,0,0.15);
        }
        .btn-cute:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
        }

        /* 水果放大與彈跳動畫 */
        .grow-bounce {
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }
        .animate-pop-pulse {
            animation: popPulse 0.35s ease-in-out;
        }

        /* 第二關大水果的浮動彈跳視覺效果 */
        @keyframes fruitFloat {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            50% { transform: translateY(-10px) rotate(3deg) scale(1.03); }
        }
        .animate-fruit-float {
            animation: fruitFloat 3s ease-in-out infinite;
        }

        /* 浮動氣泡背景 */
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            animation: floatUp 12s infinite linear;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
        }

        /* 皮卡丘跳躍動畫 */
        @keyframes pikaJump {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            25% { transform: translateY(-25px) scale(1.1) rotate(-5deg); }
            50% { transform: translateY(0) scale(0.95) rotate(0deg); }
            75% { transform: translateY(-12px) scale(1.05) rotate(5deg); }
        }
        .animate-pika-jump {
            animation: pikaJump 0.8s ease-in-out infinite;
        }

        /* 麥克風聲波脈衝動畫 */
        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 18px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .mic-active {
            animation: micPulse 1.2s infinite;
        }

        /* 聲波動畫棒 */
        @keyframes waveBar {
            0%, 100% { height: 6px; }
            50% { height: 26px; }
        }
        .wave-bar {
            width: 5px;
            background-color: #ef4444;
            border-radius: 3px;
            animation: waveBar 0.5s ease-in-out infinite;
        }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }

        /* 對對碰卡片翻轉 */
        .card-perspective {
            perspective: 1000px;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 1.25rem;
        }
        .card-back {
            transform: rotateY(180deg);
        }

        /* 關卡卡片背景樣式 */
        .panel-box {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 4px solid #FFF;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden relative text-gray-800">

    <!-- 背景動態氣泡 -->
    <div id="bubbles-container"></div>

    <!-- 頂部導覽列與金幣數 -->
    <header class="relative z-10 w-full max-w-5xl mx-auto px-4 pt-4">
        <div class="panel-box rounded-3xl p-3 md:p-4 flex flex-wrap items-center justify-between gap-3">
            <!-- 標題與 LOGO -->
            <div class="flex items-center space-x-3">
                <span class="text-3xl md:text-4xl animate-bounce">🍎</span>
                <div>
                    <h1 class="text-xl md:text-2xl font-black text-amber-500 tracking-wider">水果注音大冒險</h1>
                    <p class="text-xs text-gray-500 font-bold">Traditional Chinese Bopomofo Adventure</p>
                </div>
            </div>

            <!-- 關卡切換選單 -->
            <div class="flex items-center bg-amber-100/80 p-1.5 rounded-2xl border-2 border-amber-300">
                <button onclick="switchLevel(1)" id="nav-btn-1" class="px-3 py-1.5 rounded-xl font-bold text-xs md:text-sm transition-all bg-amber-500 text-white shadow-md">
                    第1關: 水果長大
                </button>
                <button onclick="switchLevel(2)" id="nav-btn-2" class="px-3 py-1.5 rounded-xl font-bold text-xs md:text-sm transition-all text-amber-800 hover:bg-amber-200">
                    第2關: 聲控滿屏
                </button>
                <button onclick="switchLevel(3)" id="nav-btn-3" class="px-3 py-1.5 rounded-xl font-bold text-xs md:text-sm transition-all text-amber-800 hover:bg-amber-200">
                    第3關: 漢字對對碰
                </button>
            </div>

            <!-- 金幣計數器 -->
            <div class="flex items-center bg-yellow-300/90 border-2 border-yellow-400 px-4 py-1.5 rounded-full shadow-inner space-x-2">
                <i class="fa-solid fa-coins text-yellow-600 text-lg md:text-xl animate-spin" style="animation-duration: 4s;"></i>
                <span id="coin-count" class="font-fun text-xl md:text-2xl text-yellow-900 font-bold">0</span>
            </div>
        </div>
    </header>

    <!-- 主要遊戲內容區域 -->
    <main class="relative z-10 flex-grow max-w-5xl w-full mx-auto p-4 flex flex-col justify-center items-center">

        <!-- 全局即時語音辨識氣泡反饋 -->
        <div id="live-speech-toast" class="w-full max-w-md mx-auto mb-3 transition-all duration-300">
            <div class="bg-amber-50 border-2 border-amber-300 rounded-full px-4 py-2 flex items-center justify-between shadow-md">
                <div class="flex items-center space-x-2 overflow-hidden">
                    <i class="fa-solid fa-microphone-lines text-red-500 animate-pulse text-lg"></i>
                    <span class="text-xs font-bold text-gray-500 whitespace-nowrap">聽到：</span>
                    <span id="speech-transcript" class="text-sm font-extrabold text-amber-900 truncate max-w-[200px]">尚未聽見發音，請按開啟麥克風</span>
                </div>
                <div id="speech-match-badge" class="bg-emerald-500 text-white text-xs font-bold px-3 py-1 rounded-full hidden flex items-center space-x-1 animate-bounce">
                    <span>正確！</span> ✨
                </div>
            </div>
        </div>

        <!-- ================= 第1關：水果放大闖關 ================= -->
        <section id="level-1" class="w-full max-w-2xl panel-box rounded-3xl p-6 text-center relative overflow-hidden my-auto">
            <!-- 關卡進度條 -->
            <div class="mb-3">
                <div class="flex justify-between items-center mb-1 text-xs font-bold text-amber-800">
                    <span>關卡進度</span>
                    <span id="l1-progress-text">水果 1 / 5</span>
                </div>
                <div class="w-full bg-amber-100 rounded-full h-4 p-1 border border-amber-300">
                    <div id="l1-progress-bar" class="bg-gradient-to-r from-amber-400 to-orange-500 h-full rounded-full transition-all duration-300" style="width: 20%;"></div>
                </div>
            </div>

            <!-- 當前水果注音與名稱 display -->
            <div class="mb-2 bg-amber-50 py-2.5 px-6 rounded-2xl border-2 border-dashed border-amber-300 inline-block">
                <h2 id="l1-fruit-name" class="text-3xl md:text-4xl font-extrabold text-amber-900">
                    <ruby>蘋<rt>ㄆㄧㄥˊ</rt></ruby><ruby>果<rt>ㄍㄨㄛˇ</rt></ruby>
                </h2>
            </div>

            <!-- 水果放大展示容器 -->
            <div class="relative h-64 md:h-72 w-full flex items-center justify-center my-3 overflow-hidden rounded-2xl bg-gradient-to-b from-blue-50/50 to-emerald-50/50 border-2 border-amber-100">
                <img id="l1-fruit-img" src="https://i.ibb.co.com/mCCz5NpZ/image.png" alt="水果" 
                     class="grow-bounce object-contain max-h-60 drop-shadow-2xl cursor-pointer"
                     style="transform: scale(0.5);" onclick="handleCorrectAnswer()">
                
                <!-- 語音狀態視覺波浪與指示 -->
                <div id="l1-speech-indicator" class="absolute bottom-3 left-1/2 transform -translate-x-1/2 bg-white/95 px-4 py-1.5 rounded-full border border-amber-200 text-xs text-amber-800 font-bold flex items-center space-x-3 shadow-lg">
                    <div id="l1-wave-box" class="flex items-center space-x-1 hidden">
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                    </div>
                    <span id="l1-mic-status">請開啟麥克風或點擊水果/模擬發音按鈕！</span>
                </div>
            </div>

            <!-- 操作按鈕區 -->
            <div class="flex flex-wrap justify-center items-center gap-3">
                <button id="l1-mic-btn" onclick="toggleSpeechRecognition()" class="btn-cute bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold px-6 py-3 rounded-2xl flex items-center space-x-2 text-base md:text-lg border-b-4 border-emerald-700">
                    <i class="fa-solid fa-microphone text-xl"></i>
                    <span id="l1-btn-text">開啟麥克風聽發音</span>
                </button>
                <button onclick="handleCorrectAnswer()" class="btn-cute bg-amber-400 hover:bg-amber-500 text-amber-950 font-extrabold px-5 py-3 rounded-2xl text-base border-b-4 border-amber-600 flex items-center space-x-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>模擬發音 (+10% 長大)</span>
                </button>
            </div>
        </section>


        <!-- ================= 第2關：注音水果大搜集 ================= -->
        <section id="level-2" class="w-full max-w-4xl panel-box rounded-3xl p-4 md:p-6 text-center relative min-h-[520px] flex flex-col justify-between hidden my-auto">
            <!-- 頂部題目提示與皮卡丘板子 -->
            <div class="flex flex-wrap items-center justify-between gap-3 bg-amber-50/90 p-3 rounded-2xl border-2 border-amber-200 shadow-sm">
                <!-- 左上皮卡丘拿牌子 -->
                <div class="flex items-center space-x-3">
                    <div class="relative">
                        <img src="https://i.ibb.co.com/3yQWTFCz/image.png" alt="Pikachu" class="w-16 h-16 md:w-20 md:h-20 object-contain animate-pika-jump">
                    </div>
                    <div class="bg-white px-4 py-2 rounded-2xl border-2 border-amber-400 shadow-md flex flex-col items-start">
                        <span class="text-xs font-bold text-amber-600">皮卡丘出題：請唸水果名</span>
                        <span id="l2-question-bopomofo" class="text-2xl md:text-3xl font-extrabold text-red-500 tracking-wider font-fun">
                            ㄆㄧㄥ ㄍㄨㄛ
                        </span>
                    </div>
                </div>

                <!-- 倒數計時與計數器 -->
                <div class="flex items-center space-x-3">
                    <div class="bg-red-100 text-red-700 px-3.5 py-2 rounded-2xl border border-red-300 font-bold flex items-center space-x-2">
                        <i class="fa-solid fa-stopwatch text-lg animate-pulse"></i>
                        <span id="l2-timer" class="text-xl font-fun">25s</span>
                    </div>
                    <div class="bg-emerald-100 text-emerald-800 px-3.5 py-2 rounded-2xl border border-emerald-300 font-bold">
                        大水果數量: <span id="l2-count" class="text-2xl font-fun text-emerald-600">0</span> / 6
                    </div>
                </div>
            </div>

            <!-- 大水果隨機生成畫布區域 -->
            <div id="l2-playground" class="relative w-full h-80 md:h-96 my-3 bg-white/70 rounded-2xl border-2 border-dashed border-amber-300 overflow-hidden shadow-inner flex items-center justify-center">
                <p id="l2-empty-tip" class="text-amber-800/60 font-bold animate-pulse text-base md:text-lg z-0 px-4">
                    🎙️ 開啟麥克風大聲唸出水果名字，特大水果就會蹦出來填滿螢幕！
                </p>
            </div>

            <!-- 第2關控制項 -->
            <div class="flex flex-wrap justify-center items-center gap-3">
                <button id="l2-mic-btn" onclick="toggleSpeechRecognition()" class="btn-cute bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold px-6 py-2.5 rounded-2xl flex items-center space-x-2 border-b-4 border-emerald-700">
                    <i class="fa-solid fa-microphone"></i>
                    <span id="l2-btn-text">開啟麥克風</span>
                </button>
                <button onclick="addFruitToPlayground()" class="btn-cute bg-amber-400 hover:bg-amber-500 text-amber-950 font-extrabold px-5 py-2.5 rounded-2xl border-b-4 border-amber-600">
                    <i class="fa-solid fa-plus-circle"></i> 模擬發音 (+1 大水果)
                </button>
                <button onclick="startLevel2Round()" class="btn-cute bg-sky-400 hover:bg-sky-500 text-white font-extrabold px-4 py-2.5 rounded-2xl border-b-4 border-sky-600">
                    <i class="fa-solid fa-rotate-right"></i> 重來本題
                </button>
            </div>
        </section>


        <!-- ================= 第3關：水果漢字對對碰 (隱藏皮卡丘) ================= -->
        <section id="level-3" class="w-full max-w-4xl panel-box rounded-3xl p-4 md:p-6 text-center relative hidden my-auto">
            <div class="mb-4 flex flex-wrap justify-between items-center bg-amber-50 p-3 rounded-2xl border border-amber-200">
                <div class="text-left">
                    <h2 class="text-lg md:text-xl font-black text-amber-900">水果漢字對對碰 🎴</h2>
                    <p class="text-xs text-amber-700 font-bold">翻開配對圖案與注音漢字！找到隱藏的皮卡丘即可直接勝利！</p>
                </div>
                <button onclick="initLevel3()" class="btn-cute bg-amber-400 hover:bg-amber-500 text-amber-950 text-xs md:text-sm font-extrabold px-4 py-2 rounded-xl border-b-2 border-amber-600">
                    <i class="fa-solid fa-shuffle"></i> 重新洗牌
                </button>
            </div>

            <!-- 10張翻牌 Grid (5對，其中一張隱藏皮卡丘) -->
            <div id="card-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 md:gap-4 my-2">
                <!-- 由 JavaScript 動態生成卡片 -->
            </div>
        </section>

    </main>

    <!-- 通用勵志獎勵 Modal (皮卡丘跳出 + 金幣獎勵) -->
    <div id="reward-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-6 md:p-8 max-w-md w-11/12 text-center border-4 border-yellow-400 shadow-2xl relative transform scale-90 transition-transform duration-300" id="reward-card">
            <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-40 h-40 bg-yellow-300 rounded-full blur-2xl opacity-50 -z-10"></div>
            
            <!-- 皮卡丘獎勵圖片 -->
            <div class="relative inline-block mb-3">
                <img src="https://i.ibb.co.com/3yQWTFCz/image.png" alt="Pikachu Reward" class="w-36 h-36 md:w-44 md:h-44 object-contain mx-auto animate-pika-jump">
                <div class="absolute -bottom-2 right-0 bg-yellow-400 text-yellow-950 font-fun font-black px-3 py-1 rounded-full text-xs shadow border border-white animate-bounce">
                    +1 金幣!
                </div>
            </div>

            <h3 id="reward-title" class="text-2xl md:text-3xl font-black text-amber-800 mb-2">太棒了！獲得1枚金幣！</h3>
            <p id="reward-subtitle" class="text-amber-600 font-bold mb-6">發音非常標準喔！繼續加油！</p>

            <button onclick="closeRewardModal()" class="btn-cute w-full bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white font-black text-lg py-3 rounded-2xl border-b-4 border-orange-700">
                下一關 / 下一題 🚀
            </button>
        </div>
    </div>

    <!-- 頁腳 -->
    <footer class="relative z-10 text-center py-3 text-xs font-bold text-amber-900/60">
        <p>水果注音大冒險 🍎 台灣國語繁體注音學習</p>
    </footer>

    <!-- 遊戲 JavaScript 核心邏輯 -->
    <script>
        // 水果資料庫（含注音、注音符號變體、注音模糊檢索詞庫）
        const FRUITS_DATA = [
            {
                id: 'apple',
                name: '蘋果',
                rubyHTML: '<ruby>蘋<rt>ㄆㄧㄥˊ</rt></ruby><ruby>果<rt>ㄍㄨㄛˇ</rt></ruby>',
                bopomofo: 'ㄆㄧㄥ ㄍㄨㄛ',
                keywords: [
                    '蘋果', '平果', '苹', '果', '蘋', 
                    'ㄆㄧㄥ', 'ㄍㄨㄛ', 'ㄆㄧㄥˊ', 'ㄍㄨㄛˇ',
                    'pingguo', 'ping', 'guo', 'apple'
                ],
                img: 'https://i.ibb.co.com/mCCz5NpZ/image.png'
            },
            {
                id: 'grape',
                name: '葡萄',
                rubyHTML: '<ruby>葡<rt>ㄆㄨˊ</rt></ruby><ruby>萄<rt>ㄊㄠˊ</rt></ruby>',
                bopomofo: 'ㄆㄨ ㄊㄠ',
                keywords: [
                    '葡萄', '葡', '萄', '蒲', '桃',
                    'ㄆㄨ', 'ㄊㄠ', 'ㄆㄨˊ', 'ㄊㄠˊ',
                    'putao', 'pu', 'tao', 'grape'
                ],
                img: 'https://i.ibb.co.com/s9ShG25W/image.png'
            },
            {
                id: 'banana',
                name: '香蕉',
                rubyHTML: '<ruby>香<rt>ㄒㄧㄤ</rt></ruby><ruby>蕉<rt>ㄐㄧㄠ</rt></ruby>',
                bopomofo: 'ㄒㄧㄤ ㄐㄧㄠ',
                keywords: [
                    '香蕉', '香', '蕉', '相交', '嬌',
                    'ㄒㄧㄤ', 'ㄐㄧㄠ', 
                    'xiangjiao', 'xiang', 'jiao', 'banana'
                ],
                img: 'https://i.ibb.co.com/WW7Mr5bq/image.png'
            },
            {
                id: 'watermelon',
                name: '西瓜',
                rubyHTML: '<ruby>西<rt>ㄒㄧ</rt></ruby><ruby>瓜<rt>ㄍㄨㄚ</rt></ruby>',
                bopomofo: 'ㄒㄧ ㄍㄨㄚ',
                keywords: [
                    '西瓜', '西', '瓜', '吸瓜',
                    'ㄒㄧ', 'ㄍㄨㄚ', 
                    'xigua', 'xi', 'gua', 'watermelon'
                ],
                img: 'https://i.ibb.co.com/HTYf41h3/image.png'
            },
            {
                id: 'strawberry',
                name: '草莓',
                rubyHTML: '<ruby>草<rt>ㄘㄠˇ</rt></ruby><ruby>莓<rt>ㄇㄟˊ</rt></ruby>',
                bopomofo: 'ㄘㄠ ㄇㄟ',
                keywords: [
                    '草莓', '草', '莓', '炒莓', '霉',
                    'ㄘㄠ', 'ㄇㄟ', 'ㄘㄠˇ', 'ㄇㄟˊ',
                    'caomei', 'cao', 'mei', 'strawberry'
                ],
                img: 'https://i.ibb.co.com/ds6HN73H/image.png'
            }
        ];

        const PIKACHU_IMG = 'https://i.ibb.co.com/3yQWTFCz/image.png';

        // 全局狀態
        let currentLevel = 1;
        let userCoins = 0;
        let speechRecognition = null;
        let isListening = false;
        let lastProcessedTranscript = ""; // 記錄上次已處理過的的完整語音，防止重複觸發

        // 第1關 狀態
        let l1FruitIndex = 0;
        let l1CurrentScale = 0.5; // 初始大小 (0.5x)

        // 第2關 狀態
        let l2FruitIndex = 0;
        let l2CollectedCount = 0;
        const l2TargetCount = 6; // 6個特大水果填滿螢幕
        let l2Timer = null;
        let l2TimeLeft = 25;
        let placedPositions = []; // 避免水果嚴重重疊的座標紀錄

        // Web Audio API 音效合成器
        const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (AudioCtx.state === 'suspended') {
                AudioCtx.resume();
            }
            const osc = AudioCtx.createOscillator();
            const gain = AudioCtx.createGain();
            osc.connect(gain);
            gain.connect(AudioCtx.destination);

            const now = AudioCtx.currentTime;

            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'coin') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(987.77, now); // B5
                osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'fanfare') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const subOsc = AudioCtx.createOscillator();
                    const subGain = AudioCtx.createGain();
                    subOsc.connect(subGain);
                    subGain.connect(AudioCtx.destination);
                    subOsc.frequency.setValueAtTime(freq, now + idx * 0.09);
                    subGain.gain.setValueAtTime(0.25, now + idx * 0.09);
                    subGain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.09 + 0.25);
                    subOsc.start(now + idx * 0.09);
                    subOsc.stop(now + idx * 0.09 + 0.25);
                });
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(130, now + 0.25);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        // 初始化背景氣泡
        function createBubbles() {
            const container = document.getElementById('bubbles-container');
            for (let i = 0; i < 12; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                const size = Math.random() * 60 + 20;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${Math.random() * 100}%`;
                bubble.style.animationDelay = `${Math.random() * 8}s`;
                bubble.style.animationDuration = `${Math.random() * 6 + 8}s`;
                container.appendChild(bubble);
            }
        }

        // 關卡切換邏輯
        function switchLevel(lvl) {
            currentLevel = lvl;
            clearInterval(l2Timer);

            document.getElementById('level-1').classList.add('hidden');
            document.getElementById('level-2').classList.add('hidden');
            document.getElementById('level-3').classList.add('hidden');

            for (let i = 1; i <= 3; i++) {
                const btn = document.getElementById(`nav-btn-${i}`);
                if (i === lvl) {
                    btn.className = "px-3 py-1.5 rounded-xl font-bold text-xs md:text-sm transition-all bg-amber-500 text-white shadow-md";
                } else {
                    btn.className = "px-3 py-1.5 rounded-xl font-bold text-xs md:text-sm transition-all text-amber-800 hover:bg-amber-200";
                }
            }

            if (lvl === 1) {
                document.getElementById('level-1').classList.remove('hidden');
                loadLevel1Fruit();
            } else if (lvl === 2) {
                document.getElementById('level-2').classList.remove('hidden');
                startLevel2Round();
            } else if (lvl === 3) {
                document.getElementById('level-3').classList.remove('hidden');
                initLevel3();
            }
            
            if (isListening) {
                updateMicUI(true);
            }

            playSound('pop');
        }

        // ==================== 第1關邏輯 ====================
        function loadLevel1Fruit() {
            const fruit = FRUITS_DATA[l1FruitIndex];
            document.getElementById('l1-fruit-name').innerHTML = fruit.rubyHTML;
            const img = document.getElementById('l1-fruit-img');
            img.src = fruit.img;
            l1CurrentScale = 0.5;
            img.style.transform = `scale(${l1CurrentScale})`;

            document.getElementById('l1-progress-text').innerText = `水果 ${l1FruitIndex + 1} / ${FRUITS_DATA.length}`;
            document.getElementById('l1-progress-bar').style.width = `${((l1FruitIndex + 1) / FRUITS_DATA.length) * 100}%`;
        }

        function handleCorrectAnswer() {
            l1CurrentScale += 0.1;
            playSound('pop');
            const img = document.getElementById('l1-fruit-img');
            img.style.transform = `scale(${l1CurrentScale.toFixed(2)})`;
            
            // 觸發彈跳效果
            img.classList.remove('animate-pop-pulse');
            void img.offsetWidth; // 觸發重繪
            img.classList.add('animate-pop-pulse');

            // 尺寸到達臨界面積（例如 >= 1.15 倍）
            if (l1CurrentScale >= 1.15) {
                addCoins(1);
                showRewardModal("太棒了！水果長到最大了！", `你成功念出了 ${FRUITS_DATA[l1FruitIndex].name} 的名稱！`, () => {
                    l1FruitIndex = (l1FruitIndex + 1) % FRUITS_DATA.length;
                    loadLevel1Fruit();
                });
            }
        }


        // ==================== 第2關邏輯 (特大水果 130px~160px) ====================
        function startLevel2Round() {
            l2CollectedCount = 0;
            l2TimeLeft = 25;
            placedPositions = [];
            document.getElementById('l2-count').innerText = l2CollectedCount;
            document.getElementById('l2-timer').innerText = `${l2TimeLeft}s`;

            const playground = document.getElementById('l2-playground');
            playground.innerHTML = `
                <p id="l2-empty-tip" class="text-amber-800/60 font-bold animate-pulse text-base md:text-lg z-0 px-4">
                    🎙️ 開啟麥克風大聲唸出水果名字，特大水果就會蹦出來填滿螢幕！
                </p>
            `;

            // 設定題目注音
            const fruit = FRUITS_DATA[l2FruitIndex];
            document.getElementById('l2-question-bopomofo').innerText = fruit.bopomofo;

            // 開啟倒數計時
            clearInterval(l2Timer);
            l2Timer = setInterval(() => {
                l2TimeLeft--;
                document.getElementById('l2-timer').innerText = `${l2TimeLeft}s`;
                if (l2TimeLeft <= 0) {
                    clearInterval(l2Timer);
                    if (l2CollectedCount < l2TargetCount) {
                        playSound('error');
                        alert("時間到囉！再試一次，快速念出水果名字填滿螢幕吧！");
                        startLevel2Round();
                    }
                }
            }, 1000);
        }

        function addFruitToPlayground() {
            if (l2CollectedCount >= l2TargetCount) return;

            const playground = document.getElementById('l2-playground');
            const tip = document.getElementById('l2-empty-tip');
            if (tip) tip.remove();

            const fruit = FRUITS_DATA[l2FruitIndex];
            const img = document.createElement('img');
            img.src = fruit.img;
            
            // 特大號水果尺寸 (130px - 160px)
            const fruitSize = Math.floor(Math.random() * 30) + 130; 
            img.style.width = `${fruitSize}px`;
            img.style.height = `${fruitSize}px`;
            img.className = 'absolute object-contain drop-shadow-2xl grow-bounce animate-fruit-float z-10 cursor-pointer';
            
            // 計算不重疊的最佳隨機座標
            const containerW = playground.clientWidth;
            const containerH = playground.clientHeight;
            
            let bestX = 10, bestY = 10;
            let foundSpread = false;

            for (let attempt = 0; attempt < 20; attempt++) {
                const rx = Math.floor(Math.random() * Math.max(10, containerW - fruitSize - 20));
                const ry = Math.floor(Math.random() * Math.max(10, containerH - fruitSize - 20));
                
                // 檢查與已有水果距離
                let hasOverlap = false;
                for (let pos of placedPositions) {
                    const dist = Math.hypot(pos.x - rx, pos.y - ry);
                    if (dist < fruitSize * 0.65) {
                        hasOverlap = true;
                        break;
                    }
                }

                if (!hasOverlap) {
                    bestX = rx;
                    bestY = ry;
                    foundSpread = true;
                    break;
                }
            }

            if (!foundSpread) {
                bestX = Math.floor(Math.random() * Math.max(10, containerW - fruitSize - 10));
                bestY = Math.floor(Math.random() * Math.max(10, containerH - fruitSize - 10));
            }

            placedPositions.push({ x: bestX, y: bestY });

            img.style.left = `${bestX}px`;
            img.style.top = `${bestY}px`;
            img.style.transform = 'scale(0)';

            playground.appendChild(img);

            // 觸發誕生彈跳效果
            setTimeout(() => {
                const randomRot = Math.floor(Math.random() * 30 - 15);
                img.style.transform = `scale(1) rotate(${randomRot}deg)`;
            }, 30);

            playSound('pop');
            l2CollectedCount++;
            document.getElementById('l2-count').innerText = l2CollectedCount;

            // 檢查是否達到目標（填滿畫面）
            if (l2CollectedCount >= l2TargetCount) {
                clearInterval(l2Timer);
                addCoins(1);
                setTimeout(() => {
                    showRewardModal("大水果滿屏成功！🎉", `你成功的發音集滿了特大號 ${fruit.name}！`, () => {
                        l2FruitIndex = (l2FruitIndex + 1) % FRUITS_DATA.length;
                        startLevel2Round();
                    });
                }, 600);
            }
        }


        // ==================== 第3關邏輯 (對對碰 + 皮卡丘隱藏) ====================
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let isBoardLocked = false;

        function initLevel3() {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';
            flippedCards = [];
            matchedPairs = 0;
            isBoardLocked = false;

            const shuffledFruits = [...FRUITS_DATA].sort(() => 0.5 - Math.random()).slice(0, 4);
            let cardDeck = [];
            
            shuffledFruits.forEach((fruit, idx) => {
                cardDeck.push({ id: idx, type: 'img', fruit: fruit, value: fruit.id });
                cardDeck.push({ id: idx, type: 'text', fruit: fruit, value: fruit.id });
            });

            cardDeck.push({ id: 99, type: 'pikachu', value: 'pika' });
            cardDeck.push({ id: 99, type: 'pikachu-star', value: 'pika' });

            cardDeck.sort(() => 0.5 - Math.random());
            cards = cardDeck;

            cardDeck.forEach((cardData, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card card-perspective h-28 md:h-36 cursor-pointer';
                cardEl.dataset.index = index;

                let backContent = '';
                if (cardData.type === 'img') {
                    backContent = `<img src="${cardData.fruit.img}" class="w-16 h-16 md:w-20 md:h-20 object-contain mx-auto">`;
                } else if (cardData.type === 'text') {
                    backContent = `
                        <div class="text-center font-bold text-amber-900">
                            <div class="text-lg md:text-xl">${cardData.fruit.rubyHTML}</div>
                        </div>
                    `;
                } else if (cardData.type === 'pikachu') {
                    backContent = `<img src="${PIKACHU_IMG}" class="w-16 h-16 md:w-20 md:h-20 object-contain mx-auto animate-bounce">`;
                } else {
                    backContent = `
                        <div class="text-center font-black text-yellow-600">
                            <i class="fa-solid fa-star text-3xl mb-1 text-yellow-400"></i>
                            <div class="text-xs">幸運星</div>
                        </div>
                    `;
                }

                cardEl.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front bg-gradient-to-br from-amber-300 to-orange-400 border-2 border-white shadow-md flex items-center justify-center text-white text-2xl font-black">
                            ❓
                        </div>
                        <div class="card-back bg-white border-2 border-amber-300 shadow-md flex items-center justify-center p-2">
                            ${backContent}
                        </div>
                    </div>
                `;

                cardEl.addEventListener('click', () => handleCardClick(index, cardEl));
                grid.appendChild(cardEl);
            });
        }

        function handleCardClick(index, cardEl) {
            if (isBoardLocked) return;
            if (cardEl.classList.contains('flipped')) return;

            const cardData = cards[index];
            cardEl.classList.add('flipped');
            playSound('pop');

            if (cardData.type === 'pikachu') {
                isBoardLocked = true;
                playSound('fanfare');
                setTimeout(() => {
                    addCoins(3);
                    confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                    showRewardModal("🎉 找到隱藏皮卡丘了！", "太幸運了！發現隱藏的皮卡丘，直接獲得 3 枚金幣與大勝利！", () => {
                        initLevel3();
                    });
                }, 600);
                return;
            }

            flippedCards.push({ index, cardEl, cardData });

            if (flippedCards.length === 2) {
                isBoardLocked = true;
                const [first, second] = flippedCards;

                if (first.cardData.value === second.cardData.value) {
                    playSound('coin');
                    matchedPairs++;
                    flippedCards = [];
                    isBoardLocked = false;

                    if (matchedPairs >= 4) {
                        setTimeout(() => {
                            addCoins(2);
                            showRewardModal("通關成功！", "太厲害了，所有水果對對碰都完成了！", () => {
                                initLevel3();
                            });
                        }, 500);
                    }
                } else {
                    setTimeout(() => {
                        first.cardEl.classList.remove('flipped');
                        second.cardEl.classList.remove('flipped');
                        flippedCards = [];
                        isBoardLocked = false;
                    }, 1000);
                }
            }
        }


        // ==================== 修正後的精準單次語音辨識機制 ====================
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return null;

            const rec = new SpeechRecognition();
            rec.lang = 'zh-TW';
            rec.continuous = true;
            rec.interimResults = true;
            rec.maxAlternatives = 1;

            rec.onresult = (event) => {
                // 1. 只取得「最新一次」產生的語音片段，絕對不累積歷史片段
                const lastIndex = event.results.length - 1;
                if (lastIndex < 0) return;

                const latestResult = event.results[lastIndex];
                const rawTranscript = latestResult[0].transcript.trim().toLowerCase();

                if (!rawTranscript) return;

                // 2. 更新畫面上的聽講氣泡提示
                showSpeechToast(rawTranscript);

                // 3. 獲取當前關卡目標水果
                let targetFruit = null;
                if (currentLevel === 1) targetFruit = FRUITS_DATA[l1FruitIndex];
                if (currentLevel === 2) targetFruit = FRUITS_DATA[l2FruitIndex];

                if (!targetFruit) return;

                // 4. 精準匹配檢查：只有最新聽到的這段語音包含目標水果關鍵字才觸發
                const isMatched = targetFruit.keywords.some(kw => rawTranscript.includes(kw.toLowerCase()));

                if (isMatched) {
                    // 防止同一句語音在連續 result 事件中重複觸發
                    if (lastProcessedTranscript === rawTranscript) return;
                    lastProcessedTranscript = rawTranscript;

                    triggerSpeechMatchBadge();

                    if (currentLevel === 1) {
                        handleCorrectAnswer();
                    } else if (currentLevel === 2) {
                        addFruitToPlayground();
                    }
                }
            };

            rec.onerror = (err) => {
                console.warn("Speech recognition status:", err.error);
            };

            rec.onend = () => {
                // 語音斷開後重啟，並重置上一句的記憶，迎接孩子下一句全新發音
                lastProcessedTranscript = "";
                if (isListening) {
                    try {
                        rec.start();
                    } catch(e) {}
                }
            };

            return rec;
        }

        function toggleSpeechRecognition() {
            if (!speechRecognition) {
                speechRecognition = initSpeechRecognition();
            }

            if (!speechRecognition) {
                alert("您的瀏覽器暫不支援自動語音識別，請使用『模擬發音』按鈕體驗遊戲！");
                return;
            }

            if (isListening) {
                stopSpeechRecognition();
            } else {
                startSpeechRecognition();
            }
        }

        function startSpeechRecognition() {
            if (speechRecognition) {
                try {
                    lastProcessedTranscript = "";
                    speechRecognition.start();
                    isListening = true;
                    updateMicUI(true);
                } catch(e) {
                    isListening = true;
                    updateMicUI(true);
                }
            }
        }

        function stopSpeechRecognition() {
            if (speechRecognition) {
                isListening = false;
                try {
                    speechRecognition.stop();
                } catch(e) {}
                updateMicUI(false);
            }
        }

        function updateMicUI(active) {
            const btn1 = document.getElementById('l1-mic-btn');
            const btn2 = document.getElementById('l2-mic-btn');
            const l1Wave = document.getElementById('l1-wave-box');
            const l1Status = document.getElementById('l1-mic-status');

            if (active) {
                if (btn1) {
                    btn1.className = "btn-cute bg-red-500 hover:bg-red-600 text-white font-extrabold px-6 py-3 rounded-2xl flex items-center space-x-2 text-base md:text-lg border-b-4 border-red-700 mic-active";
                    document.getElementById('l1-btn-text').innerText = "麥克風聽講中...";
                }
                if (btn2) {
                    btn2.className = "btn-cute bg-red-500 hover:bg-red-600 text-white font-extrabold px-6 py-2.5 rounded-2xl flex items-center space-x-2 border-b-4 border-red-700 mic-active";
                    document.getElementById('l2-btn-text').innerText = "麥克風聽講中...";
                }
                if (l1Wave) l1Wave.classList.remove('hidden');
                if (l1Status) l1Status.innerText = "請大聲唸出水果名稱！";
            } else {
                if (btn1) {
                    btn1.className = "btn-cute bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold px-6 py-3 rounded-2xl flex items-center space-x-2 text-base md:text-lg border-b-4 border-emerald-700";
                    document.getElementById('l1-btn-text').innerText = "開啟麥克風聽發音";
                }
                if (btn2) {
                    btn2.className = "btn-cute bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold px-6 py-2.5 rounded-2xl flex items-center space-x-2 border-b-4 border-emerald-700";
                    document.getElementById('l2-btn-text').innerText = "開啟麥克風";
                }
                if (l1Wave) l1Wave.classList.add('hidden');
                if (l1Status) l1Status.innerText = "請開啟麥克風或點擊水果/模擬發音按鈕！";
            }
        }

        function showSpeechToast(text) {
            const toast = document.getElementById('live-speech-toast');
            const textEl = document.getElementById('speech-transcript');
            textEl.innerText = text;
            toast.classList.remove('hidden');
        }

        function triggerSpeechMatchBadge() {
            const badge = document.getElementById('speech-match-badge');
            badge.classList.remove('hidden');
            setTimeout(() => {
                badge.classList.add('hidden');
            }, 1200);
        }


        // ==================== 金幣與獎勵彈窗 ====================
        function addCoins(amount) {
            userCoins += amount;
            document.getElementById('coin-count').innerText = userCoins;
            playSound('coin');
        }

        let onRewardModalClose = null;

        function showRewardModal(title, subtitle, onClose) {
            playSound('fanfare');
            confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });

            document.getElementById('reward-title').innerText = title;
            document.getElementById('reward-subtitle').innerText = subtitle;
            onRewardModalClose = onClose;

            const modal = document.getElementById('reward-modal');
            const card = document.getElementById('reward-card');
            modal.classList.remove('hidden');
            
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                card.classList.remove('scale-90');
                card.classList.add('scale-100');
            }, 10);
        }

        function closeRewardModal() {
            const modal = document.getElementById('reward-modal');
            const card = document.getElementById('reward-card');
            
            modal.classList.add('opacity-0');
            card.classList.remove('scale-100');
            card.classList.add('scale-90');

            setTimeout(() => {
                modal.classList.add('hidden');
                if (onRewardModalClose) {
                    onRewardModalClose();
                    onRewardModalClose = null;
                }
            }, 300);
        }

        // 頁面加載完成初始化
        window.onload = function() {
            createBubbles();
            switchLevel(1);
        };
    </script>
</body>
